# Fetches the Turing Award room (Wikidata, the Wikipedia laureates list, Commons portraits) on a GitHub runner,
# because Wikimedia rate-limits the cloud sandbox, then rebuilds curated/ and data.json and commits them.
name: fetch-turing
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - config/turing.json
      - scripts/fetch_turing.py
      - .github/workflows/fetch-turing.yml
permissions:
  contents: write
concurrency:
  group: fetch-turing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch
        run: cd scripts && python fetch_turing.py
      - name: Rebuild curated and data.json
        run: cd scripts && python build_curated.py && python export_web.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add raw/turing web/public/turing curated web/public/data.json
          git diff --cached --quiet || (git commit -m "Turing room: Wikipedia list and portraits" && git push)
